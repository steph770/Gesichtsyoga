<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Abendliche Gesichtsyoga-Routine mit Gua Sha und Gesichtsroller">
<meta name="theme-color" content="#EBEFE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1712" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 32 32'%3E%3Crect x='-2' y='-2' width='32' height='32' rx='8' fill='%23EBEFE5'/%3E%3Cpath d='M4.5 23C4.5 12.5 11 5.2 23.5 4.2c.6 11.6-6.4 18.8-19 18.8Z' fill='%234D7357'/%3E%3Cpath d='M4.5 23 15 12.5M10 17.5l-.6-4M13 14.5l4 .4' fill='none' stroke='%23F6F7F1' stroke-width='.9' stroke-linecap='round'/%3E%3Ccircle cx='19.6' cy='19.8' r='2.7' fill='%239C6F12'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Abendtau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Courier+Prime&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Herbarium-Mappe - gepresster Zweig im Kopf, Übungen als Etiketten-Bögen, der Player als botanische Tafel */
:root {
  --paper: #EBEFE5;
  --paper-glass: rgba(235, 239, 229, .9);
  --sheet: #F6F7F1;
  --sheet-2: #DFE5D7;
  --ink: #1D3026;
  --ink-2: #4C6255;
  --ink-3: #75897B;
  --leaf: #4D7357;
  --leaf-deep: #2D4F3D;
  --leaf-wash: #DAE5D5;
  --on-leaf: #F4F6EE;
  --pollen: #9C6F12;
  --bloom: #C6877F;
  --euca: #5E8780;
  --line: rgba(29, 48, 38, .16);
  --line-2: rgba(29, 48, 38, .08);
  --skin: #F8F0E8;
  --skin-line: #5F7365;
  --hair: #EADDBB;
  --hair-ln: #C7AC78;
  --brow: #9C7F5C;
  --iris: #7A5233;
  --pupil: #2B1D12;
  --freckle: #C38E70;
  --blush: #E3A398;
  --mouth: #A9665F;
  --veil: rgba(235, 239, 229, .9);
  --scrim: rgba(20, 32, 26, .38);
  --shadow: 0 1px 2px rgba(29, 48, 38, .06), 0 12px 28px -14px rgba(29, 48, 38, .28);
  --stone: #E5B2A8;
  --stone-hi: #FBE3DD;
  --stone-edge: #B57A70;
  --metal: #9F9C93;
  --font-display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
  --font-label: "Courier Prime", "Courier New", ui-monospace, monospace;
  --r-lg: 22px;
  --r-md: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1712; --paper-glass: rgba(13, 23, 18, .9); --sheet: #14221B; --sheet-2: #1C2E24;
    --ink: #E4EADC; --ink-2: #A8B9AA; --ink-3: #7F9385;
    --leaf: #8DB694; --leaf-deep: #8DB694; --leaf-wash: #1F3529; --on-leaf: #0D1712;
    --pollen: #D9B464; --bloom: #E0A9A1; --euca: #93BDB6;
    --line: rgba(228, 234, 220, .15); --line-2: rgba(228, 234, 220, .07);
    --skin: #1B2A22; --skin-line: #B7C7B9; --hair: #6D6346; --hair-ln: #A08E62; --brow: #A08B69; --iris: #BC9363; --pupil: #0D1712; --freckle: #8D6C56; --blush: #C98B84; --mouth: #5E3532;
    --veil: rgba(13, 23, 18, .88); --scrim: rgba(0, 0, 0, .55);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 32px -14px rgba(0, 0, 0, .7);
    --metal: #8D918A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1712; --paper-glass: rgba(13, 23, 18, .9); --sheet: #14221B; --sheet-2: #1C2E24;
  --ink: #E4EADC; --ink-2: #A8B9AA; --ink-3: #7F9385;
  --leaf: #8DB694; --leaf-deep: #8DB694; --leaf-wash: #1F3529; --on-leaf: #0D1712;
  --pollen: #D9B464; --bloom: #E0A9A1; --euca: #93BDB6;
  --line: rgba(228, 234, 220, .15); --line-2: rgba(228, 234, 220, .07);
  --skin: #1B2A22; --skin-line: #B7C7B9; --hair: #6D6346; --hair-ln: #A08E62; --brow: #A08B69; --iris: #BC9363; --pupil: #0D1712; --freckle: #8D6C56; --blush: #C98B84; --mouth: #5E3532;
  --veil: rgba(13, 23, 18, .88); --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 32px -14px rgba(0, 0, 0, .7);
  --metal: #8D918A;
  color-scheme: dark;
}
:root[data-stone="jade"] { --stone: #94C3A0; --stone-hi: #DCF0E0; --stone-edge: #5A9069; }
:root[data-stone="amethyst"] { --stone: #BCA6D8; --stone-hi: #ECE3F6; --stone-edge: #8268A8; }

/* ---------- Grundlagen ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
html.locked, html.locked body { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .45; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pollen); outline-offset: 2px; }
.ic { display: inline-block; flex: none; vertical-align: middle; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; }

.wrap { max-width: 560px; margin-inline: auto; padding-inline: 16px; padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Kopfzeile ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper-glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-2); }
.topbar-in { max-width: 560px; margin-inline: auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; line-height: 1; letter-spacing: .01em; color: var(--ink); }
.brand .mark { width: 28px; height: 28px; }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink-2); padding: 0; }
.icon-btn .ic { width: 20px; height: 20px; }
.icon-btn.sound[aria-pressed="false"] { color: var(--ink-3); background: transparent; border-style: dashed; }

/* ---------- Heute ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 6px; align-items: end; padding-block: 24px 4px; }
.eyebrow { font-family: var(--font-label); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.greet { font-family: var(--font-display); font-weight: 500; font-size: clamp(2.5rem, 11vw, 3.4rem); line-height: .96; margin: 0; letter-spacing: -.01em; }
.greet em { display: block; font-style: italic; font-weight: 600; color: var(--leaf-deep); }
.phrase { margin: 12px 0 0; color: var(--ink-2); font-size: 1.02rem; }
.hero-art { align-self: start; width: 104px; margin-top: -6px; }
.hero-art .sprig { width: 100%; height: auto; display: block; }

.week { margin-block: 18px 20px; }
.week-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-family: var(--font-label); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.pod { width: 40px; height: 40px; border-radius: 999px; border: 1px dashed var(--line); display: grid; place-items: center; }
.pod .leaf { width: 26px; height: 26px; }
.day.done .pod { border: 1px solid transparent; background: var(--leaf-wash); }
.day.today { color: var(--ink); font-weight: 700; }
.day.today .pod { border: 1.5px solid var(--pollen); }
.week-note { margin: 12px 2px 0; display: flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--ink-2); }
.week-note .ic { width: 18px; height: 18px; color: var(--pollen); }
.week-note b { color: var(--ink); font-weight: 600; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 16px; box-shadow: var(--shadow); }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.85rem; line-height: 1.05; margin: 0 0 16px; }
.field { display: grid; gap: 8px; margin-bottom: 18px; min-width: 0; }
.field-label { font-family: var(--font-label); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.hint { margin: 0; font-size: .87rem; color: var(--ink-2); }

.tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tool { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 8px; align-items: center; text-align: left; min-height: 60px; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.tool .ic { grid-row: span 2; width: 24px; height: 24px; color: var(--leaf); }
.tool b { font-weight: 600; font-size: .98rem; line-height: 1.2; }
.tool small { font-size: .76rem; line-height: 1.25; color: var(--ink-2); }
.tool[aria-pressed="true"] { background: var(--leaf-wash); border-color: var(--leaf-deep); box-shadow: inset 0 0 0 1px var(--leaf-deep); }

.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: var(--sheet-2); }
.seg.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 9px 4px; font-weight: 600; font-size: .95rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 2px 6px -2px var(--line); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: .92rem; font-weight: 500; line-height: 1.2; display: inline-flex; align-items: center; gap: 6px; }
.chip .ic { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--leaf-deep); border-color: var(--leaf-deep); color: var(--on-leaf); }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line-2); cursor: pointer; }
.switch-row + .switch-row { border-top: 1px solid var(--line-2); }
.switch-row b { display: block; font-weight: 600; }
.switch-row small { display: block; color: var(--ink-2); font-size: .85rem; line-height: 1.35; }
.switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 50px; height: 30px; margin: 0; border-radius: 999px; background: var(--sheet-2); border: 1px solid var(--line); transition: background .2s, border-color .2s; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: var(--ink-3); transition: transform .2s, background .2s; }
.switch:checked { background: var(--leaf-deep); border-color: var(--leaf-deep); }
.switch:checked::after { transform: translateX(20px); background: var(--on-leaf); }

.btn-primary { width: 100%; min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px; padding: 0 22px; background: var(--leaf-deep); color: var(--on-leaf); font-weight: 650; font-size: 1.06rem; box-shadow: 0 10px 22px -12px var(--leaf-deep); }
.btn-primary .ic { width: 20px; height: 20px; }
.btn-primary .sub { font-weight: 500; opacity: .78; font-variant-numeric: tabular-nums; }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); font-size: .93rem; font-weight: 550; }
.btn-ghost .ic { width: 18px; height: 18px; color: var(--leaf); }
.btn-ghost.danger { color: var(--mouth); }
.btn-ghost.danger .ic { color: var(--mouth); }
.btn-text { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 2px; color: var(--leaf-deep); font-weight: 600; font-size: .92rem; }
.btn-text .ic { width: 18px; height: 18px; }
.start-row { margin-top: 4px; }

.plan { margin-top: 22px; }
.plan-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
.plan-head .btn-text { white-space: nowrap; }
.plan-meta { margin: 0 0 6px; font-size: .86rem; color: var(--ink-2); }
.plan-head h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; line-height: 1.1; }
.plan-head .meta { display: block; font-family: var(--font-body); font-size: .85rem; font-weight: 400; color: var(--ink-2); }
.plan-list { list-style: none; margin: 0; padding: 0; }
.plan-list li { display: grid; grid-template-columns: 24px 20px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.plan-list .n { font-family: var(--font-label); font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.plan-list .ic { width: 18px; height: 18px; color: var(--leaf); }
.plan-list .nm { min-width: 0; padding: 0; border: 0; background: none; text-align: left; font-size: .97rem; color: var(--ink); overflow-wrap: anywhere; }
.plan-list .t { font-size: .86rem; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plan-list li.care .nm { color: var(--ink-2); }
.plan-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.section-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; line-height: 1.1; }

/* ---------- Seitenköpfe ---------- */
.page-head { padding-block: 24px 14px; }
.page-head h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 2.4rem; line-height: 1.02; }
.page-head p { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; }

/* ---------- Routinen ---------- */
.routines { display: grid; gap: 10px; }
.routine-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 14px 14px 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--sheet); }
.routine-card h3 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; line-height: 1.1; overflow-wrap: anywhere; }
.routine-card .meta { font-size: .86rem; color: var(--ink-2); }
.routine-card .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.cat-strip { grid-column: 1 / -1; display: flex; gap: 3px; height: 6px; }
.cat-strip span { border-radius: 99px; background: var(--leaf); opacity: .85; }
.cat-strip span.c-guasha { background: var(--pollen); }
.cat-strip span.c-roller { background: var(--euca); }
.cat-strip span.c-pflege { background: var(--bloom); }
.cat-strip span.c-ankommen, .cat-strip span.c-abschluss { background: var(--ink-3); }
.pill { display: inline-block; margin-left: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--font-label); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); vertical-align: middle; }
.play-btn { width: 50px; height: 50px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 999px; background: var(--leaf-deep); color: var(--on-leaf); }
.play-btn .ic { width: 20px; height: 20px; margin-left: 2px; }
.empty { padding: 22px 18px; border: 1px dashed var(--line); border-radius: var(--r-md); color: var(--ink-2); text-align: center; }
.empty p { margin: 0 0 12px; }

/* ---------- Übungen ---------- */
.filters { display: grid; gap: 10px; margin-bottom: 18px; }
.specimens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 520px) { .specimens { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.specimen { display: flex; flex-direction: column; min-width: 0; padding: 0; text-align: left; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); color: var(--ink); overflow: hidden; }
.specimen .mount { display: block; position: relative; aspect-ratio: 1 / 1; max-width: 100%; background: var(--paper); border-bottom: 1px solid var(--line); }
.specimen .mount svg { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); }
.specimen .label { display: grid; gap: 3px; padding: 8px 10px 11px; }
.latin { font-family: var(--font-label); font-size: .72rem; line-height: 1.25; color: var(--ink-2); overflow-wrap: anywhere; }
.specimen .nm { font-family: var(--font-display); font-weight: 600; font-size: 1.18rem; line-height: 1.08; }
.specimen .meta { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.specimen .meta .ic { width: 15px; height: 15px; color: var(--leaf); }
.count-note { margin: -6px 0 12px; font-size: .86rem; color: var(--ink-2); }

.know { margin-top: 30px; display: grid; gap: 8px; }
.know h2 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; }
details.acc { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--sheet); }
details.acc summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-weight: 600; cursor: pointer; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary .ic { width: 20px; height: 20px; color: var(--leaf); }
details.acc summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 1.6px solid var(--ink-2); border-bottom: 1.6px solid var(--ink-2); transform: rotate(45deg); transition: transform .2s; }
details.acc[open] summary::after { transform: rotate(-135deg); }
details.acc ul { margin: 0; padding: 0 18px 16px 46px; display: grid; gap: 7px; font-size: .95rem; color: var(--ink-2); }

/* ---------- Verlauf ---------- */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
@media (min-width: 500px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--sheet); min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.stat span { font-size: .8rem; color: var(--ink-2); }
.stat.hl b { color: var(--pollen); }
.cal { padding: 14px 12px 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.cal-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.55rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; padding-block: 2px 4px; font-family: var(--font-label); font-size: .7rem; text-transform: uppercase; color: var(--ink-3); }
.cal-day { position: relative; aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); font-size: .86rem; font-variant-numeric: tabular-nums; }
.cal-day.blank { visibility: hidden; }
.cal-day .num { line-height: 1; }
.cal-day.has .num { position: absolute; top: 4px; left: 5px; font-size: .66rem; color: var(--ink-2); }
.cal-day .leaf { width: 66%; height: 66%; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--pollen); color: var(--ink); font-weight: 700; }
.cal-day.sel { background: var(--leaf-wash); }
.cal-day.future { opacity: .4; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .leaf { width: 18px; height: 18px; }
.daydetail { margin-top: 14px; }

/* ---------- Tabbar ---------- */

.player { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto minmax(110px, 1fr) auto auto auto; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--paper); color: var(--ink); overflow: hidden; }

/* ===== Abendtau: Ablauf-Generator ===== */
const PREP = 5, SWITCH = 3;
const stepCost = s => { const ex = EX[s.id]; return (ex.sides ? 2 * s.dur + SWITCH : s.dur) + PREP; };
const totalSecs = steps => steps.reduce((a, s) => a + stepCost(s), 0);
const practiceSecs = steps => steps.reduce((a, s) => a + (EX[s.id].sides ? 2 * s.dur : s.dur), 0);
function toolOf(steps) {
  const has = c => steps.some(s => EX[s.id] && EX[s.id].cat === c);
  const g = has('guasha'), r = has('roller');
  return g && r ? 'kombi' : g ? 'guasha' : r ? 'roller' : 'haende';
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let a = (seed >>> 0) || 1;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* Baut aus Hilfsmittel, Dauer und Fokus einen Ablauf: Ankommen, Öffnen am Hals, Hauptteil, Abschluss.
   Der Hauptteil wird nach Fokus gewichtet und mit einem Tages-Seed gemischt, damit die Abende variieren. */
function generate({ tool, minutes, focus, pflege }, seed) {
  const budget = minutes * 60;
  const scale = minutes === 5 ? 0.75 : minutes === 15 ? 1.1 : 1;
  const rnd = rng(hashStr(seed));
  const D = ex => Math.max(15, Math.round(ex.dur * scale / 5) * 5);
  const out = [], have = new Set();
  let used = 0;
  const take = (id, dur) => {
    const ex = EX[id]; if (!ex || have.has(id)) return;
    const d = dur || D(ex);
    out.push({ id, dur: d }); have.add(id); used += stepCost({ id, dur: d });
  };

  take('atem', minutes === 5 ? 40 : 60);
  if (minutes === 15 || (minutes === 10 && (focus === 'kiefer' || focus === 'entspannen'))) take('schultern', 30);
  if (tool !== 'haende') take('oel', minutes === 5 ? 25 : 30);
  if (focus === 'abschwellen' || minutes === 15 || (minutes === 10 && focus === 'ausgewogen' && tool === 'haende')) take('schluesselbein', minutes === 5 ? 20 : 30);
  if (tool === 'guasha' || tool === 'kombi') take('gs-hals');
  if (tool === 'roller') take('ro-hals');

  const closers = [];
  if (tool === 'haende') closers.push('abschluss-haende');
  if (tool === 'guasha' || tool === 'kombi') closers.push('gs-abschluss');
  if (tool === 'roller' || tool === 'kombi') closers.push('ro-kuehl');
  if (minutes >= 10 || focus === 'entspannen') closers.push('palmieren');
  const closerCost = closers.reduce((a, id) => a + stepCost({ id, dur: D(EX[id]) }), 0);

  const toolCat = tool === 'roller' ? 'roller' : tool === 'haende' ? null : 'guasha';
  const pool = EX_LIST.filter(ex => !ex.role && !have.has(ex.id) && ex.modes.includes(tool) && (ex.cat === 'yoga' || ex.cat === toolCat));
  let toolCap = { 5: 3, 10: 5, 15: 7 }[minutes] || 5;
  let yogaCap = tool === 'haende' ? 99 : ({ 5: 1, 10: 2, 15: 4 }[minutes] || 2);
  if (focus === 'kiefer' && tool !== 'haende') { yogaCap += 1; toolCap = Math.max(2, toolCap - 1); }
  const scored = pool.map(ex => ({
    ex,
    s: ex.prio + (focus === 'ausgewogen' ? 1 : ex.focus.includes(focus) ? 3.5 : 0) + rnd() * 2.2 - (ex.cat === 'yoga' && tool !== 'haende' ? 0.6 : 0)
  })).sort((a, b) => b.s - a.s);

  const mainBudget = budget - used - closerCost, tol = 15;
  let mainUsed = 0, nTool = 0, nYoga = 0;
  const picked = [];
  for (const { ex } of scored) {
    const yoga = ex.cat === 'yoga';
    if (yoga ? nYoga >= yogaCap : nTool >= toolCap) continue;
    const c = stepCost({ id: ex.id, dur: D(ex) });
    if (mainUsed + c > mainBudget + tol) continue;
    picked.push(ex); mainUsed += c; if (yoga) nYoga++; else nTool++;
  }
  if (mainBudget - mainUsed > 40) {
    for (const { ex } of scored) {
      if (picked.includes(ex)) continue;
      const c = stepCost({ id: ex.id, dur: D(ex) });
      if (mainUsed + c <= mainBudget + tol) { picked.push(ex); mainUsed += c; }
    }
  }
  picked.forEach(ex => take(ex.id));
  closers.forEach(id => take(id));
  if (pflege) { take('reinigen', 60); take('serum', 30); take('nachtpflege', 45); }
  out.sort((a, b) => EX[a.id].order - EX[b.id].order);
  return out;
}

  }

})();

    } else {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

        b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;

    let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(d[i]));
    const g = peak ? 0.9 / peak : 1; for (let i = 0; i < n; i++) d[i] *= g;
    return (bufs[kind] = buf);

  const lfo = (freq, depth, target) => { const o = ctx.createOscillator(); o.frequency.value = freq; const g = ctx.createGain(); g.gain.value = depth; o.connect(g); g.connect(target); return o; };

  function sea(out) {
    const s1 = src('brown'), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 0.4;
    const wave = ctx.createGain(); wave.gain.value = 0.55;
    const l1 = lfo(0.085, 0.32, wave.gain), l2 = lfo(0.137, 0.12, wave.gain);
    s1.connect(lp); lp.connect(wave); wave.connect(out);
    const s2 = src('pink'), bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.5;
    const foam = ctx.createGain(); foam.gain.value = 0.05; const l3 = lfo(0.085, 0.045, foam.gain);
    s2.connect(bp); bp.connect(foam); foam.connect(out);
    return [s1, s2, l1, l2, l3];
  }
  function rain(out) {
    const s1 = src('pink'), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 450;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
    const g = ctx.createGain(); g.gain.value = 0.3; const l1 = lfo(0.21, 0.05, g.gain);

  }

    const notes = [146.83, 220.0, 293.66, 329.63, 440.0];
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.7;
    const l0 = lfo(0.05, 350, lp.frequency);
    const sum = ctx.createGain(); sum.gain.value = 0.9; lp.connect(sum); sum.connect(out);
    const nodes = [l0];
    notes.forEach((f, i) => [-0.6, 0.6].forEach(det => {

      const g = ctx.createGain(); const base = i === 4 ? 0.022 : 0.055; g.gain.value = base;

  function stopAmbient(fade = 1.5) {
    if (!amb || !ctx) return;
    const { nodes, out } = amb; amb = null;
    const t = ctx.currentTime;
    out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value, t); out.gain.linearRampToValueAtTime(0, t + fade);

  }

    const c = cfg(); if (!c.sound || !c.chime) return;
    if (!ensure()) return;

      });
    });
    setTimeout(() => { try { out.disconnect(); } catch (e) {} }, 7500 * decay);
  }

  return {
    config(fn) { cfg = fn; },
    unlock() { ensure(); },
    bowl,
    ting() { bowl({ strength: 0.55, pitch: 2, decay: 0.45 }); },
    startAmbient, stopAmbient,
    setAmbientVol(v) { ambVol = v; applyAmb(); },

    setMuted(m) { if (ctx) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.08); },
    ambientOn: () => !!amb

})();

const Voice = (() => {
  const synth = window.speechSynthesis || null;
  let voices = [], cfg = () => ({}), current = null, timer = 0;
  function refresh() { try { voices = (synth ? synth.getVoices() : []).filter(v => /^de([-_]|$)/i.test(v.lang)); } catch (e) { voices = []; } }
  if (synth) { refresh(); try { synth.addEventListener('voiceschanged', refresh); } catch (e) { synth.onvoiceschanged = refresh; } }
  function pick() {
    const c = cfg();
    return voices.find(v => v.voiceURI === c.voiceURI) || voices.find(v => /de[-_]AT/i.test(v.lang)) || voices.find(v => /google/i.test(v.name)) || voices.find(v => v.localService) || voices[0] || null;
  }
  function say(text) {
    const c = cfg();
    if (!synth || !c.sound || !c.voice || !text) return;
    try {
      clearTimeout(timer); if (synth.speaking || synth.pending) synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pick(); if (v) u.voice = v;
      u.lang = v ? v.lang : 'de-DE'; u.rate = c.rate || 0.95; u.pitch = 1;
      u.onstart = () => Sound.duck(true);
      u.onend = u.onerror = () => { Sound.duck(false); if (current === u) current = null; };
      current = u;
      if (synth.speaking || synth.pending) timer = setTimeout(() => { try { synth.speak(u); } catch (e) {} }, 60);
      else synth.speak(u);
    } catch (e) {}
  }
  function cancel() { clearTimeout(timer); try { if (synth) synth.cancel(); } catch (e) {} current = null; Sound.duck(false); }
  return { say, cancel, config(fn) { cfg = fn; }, list: () => (refresh(), voices), available: () => !!synth };
})();
